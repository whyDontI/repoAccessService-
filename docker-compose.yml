services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: repo_access
      POSTGRES_USER: repo_access
      POSTGRES_PASSWORD: repo_access
    ports:
      - "5432:5432"
    volumes:
      - ./backend/app/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U repo_access"]
      interval: 2s
      timeout: 2s
      retries: 30
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://repo_access:repo_access@postgres:5432/repo_access
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1536M

  frontend:
    build: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 2048M

volumes:
  pgdata:
